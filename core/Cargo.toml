[package]
name = "catcore"
version = "0.1.0"
edition = "2021"
description = "Núcleo compartilhado do estudo (importadores, SQLite, fila de sync, busca)"
license = "MIT"

[lib]
name = "catcore"
path = "src/lib.rs"

[[bin]]
name = "catcore"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
