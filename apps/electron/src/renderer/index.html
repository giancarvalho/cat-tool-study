<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: asset: http://asset.localhost data:">
<title>CAT Study (Electron)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="barra">

  <span id="contador">0/0</span>
  <button id="b-mesclar">Mesclar</button>
  <button id="b-dividir">Dividir</button>

<div id="resultados" hidden></div>
<div id="pc" hidden><div id="pc-pag"></div><img id="pc-img" alt="prévia compilada"></div>

  <div id="lista"><div id="lista-in"></div></div>
  <div id="previa"><div id="previa-in"></div></div>
</div>
<div id="rodape"><span id="estado">pronto</span><span id="ultimo"></span></div>
<div id="modal" hidden><div id="modal-caixa"><p id="modal-txt"></p><p class="dica">Enter = Sim · Esc = Não</p></div></div>

</body>
