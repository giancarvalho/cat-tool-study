[package]
name = "catstudy-tauri"
version = "0.1.0"
edition = "2021"
description = "CAT Study: candidato Tauri 2 (núcleo em processo)"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
catcore = { path = "../../../core" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
