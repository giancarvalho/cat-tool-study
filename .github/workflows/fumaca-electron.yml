# Teste de fumaça do Electron fora do Windows: compila, testa e (depois) empacota. Não é medição.
# O Windows entra como controle. Só corpus sintético e memória de tradução sintética.
name: fumaca-electron

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fumaca:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4

      - uses: actions/setup-python@v7
        with:
          python-version: 3.12.10

      - name: Rust (core/rust-toolchain.toml)
        working-directory: core
        run: rustup toolchain install

      - name: Registrar o ambiente
        run: |
          mkdir -p fumaca-logs
          {
            echo "imagem: $ImageOS $ImageVersion"
            echo "arquitetura: $(uname -m)"
            echo "node: $(node -v)"
            echo "python: $(python -V)"
            echo "rustc: $(cd core && rustc -V)"
          } | tee fumaca-logs/ambiente.txt
          echo "::notice title=ambiente ${{ matrix.os }}::$(paste -sd';' fumaca-logs/ambiente.txt)"

      - name: Corpus sintético
        working-directory: corpus
        run: |
          set -o pipefail
          {
            python -m pip install python-docx==1.2.0 openpyxl==3.1.5 lxml
            python gen_corpus.py out
          } 2>&1 | tee ../fumaca-logs/corpus.log

      - name: Núcleo - compilar
        working-directory: core
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee ../fumaca-logs/core-build.log

      - name: Núcleo - testes
        working-directory: core
        run: |
          set -o pipefail
          cargo test 2>&1 | tee ../fumaca-logs/core-test.log

      - name: Electron - dependências
        working-directory: apps/electron
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../../fumaca-logs/npm-ci.log

      # O Ubuntu 24.04 restringe namespaces de usuário pelo AppArmor, e sem eles o sandbox do Chromium aborta.
      # A correção é no runner; o app nunca roda com --no-sandbox.
      - name: Ubuntu - liberar namespaces de usuário (sandbox do Chromium)
        if: runner.os == 'Linux'
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Ur true

      # A tela padrão do runner é menor que a janela do app (1440x900) e o T-R2 falha no controle.
      - name: Windows - tela de 1920x1080
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ler = 'Add-Type -AssemblyName System.Windows.Forms; $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; "$($b.Width)x$($b.Height)"'
          $antes = pwsh -NoProfile -Command $ler
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          $depois = pwsh -NoProfile -Command $ler
          "::notice title=tela windows::antes $antes; depois $depois"

      - name: Electron - T-R2 a T-R7 (desenvolvimento)
        working-directory: apps/electron
        timeout-minutes: 15
        env:
          CATCORE: ${{ github.workspace }}/core/target/release/catcore${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          set -o pipefail
          # No Ubuntu não há tela: o xvfb cria um X11 virtual maior que a janela do app (1440x900).
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" npm test -- --tm-sintetico 100000 2>&1 | tee ../../fumaca-logs/electron-dev.log
          else
            npm test -- --tm-sintetico 100000 2>&1 | tee ../../fumaca-logs/electron-dev.log
          fi

      # Wayland: tentativa. Uma falha não derruba o workflow; o resultado sai nos avisos e no relatório.
      # Sem DISPLAY, o app não tem como cair de volta no X11.
      - name: Ubuntu Wayland (Weston sem tela) - T-R2 a T-R7
        id: wayland
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 15
        env:
          CATCORE: ${{ github.workspace }}/core/target/release/catcore
          TEST_RESULT: ${{ github.workspace }}/fumaca-logs/test-result-wayland.json
        run: |
          set -o pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q weston 2>&1 | tee fumaca-logs/weston-install.log
          weston --version 2>&1 | tee fumaca-logs/weston-versao.txt
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          weston --backend=headless --renderer=pixman --width=1920 --height=1080 --idle-time=0             --socket=wayland-fumaca --log="$GITHUB_WORKSPACE/fumaca-logs/weston.log" &
          weston_pid=$!
          trap 'kill $weston_pid 2>/dev/null || true' EXIT
          for i in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/wayland-fumaca" ] && break; sleep 0.2; done
          test -S "$XDG_RUNTIME_DIR/wayland-fumaca"
          export WAYLAND_DISPLAY=wayland-fumaca
          cd apps/electron
          npm test -- --tm-sintetico 100000 --ozone-platform=wayland 2>&1 | tee ../../fumaca-logs/electron-wayland.log

      - name: Ubuntu Wayland - resultado
        if: runner.os == 'Linux' && !cancelled()
        run: |
          echo "::notice title=wayland::$(weston --version 2>/dev/null) - ${{ steps.wayland.outcome }}"

      # Pacotes: só macOS e Ubuntu (o Windows continua com harness/empacotar.py).
      # Os testes do pacote rodam sem CATCORE, para o app usar o núcleo que vai dentro dele.
      # Rodam mesmo se o teste de desenvolvimento falhar, para o registro ficar completo.
      - name: Pacote - gerar
        if: runner.os != 'Windows' && !cancelled()
        working-directory: apps/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          alvo=$([ "$RUNNER_OS" = "macOS" ] && echo --mac || echo --linux)
          npx --no-install electron-builder $alvo --publish never 2>&1 | tee ../../fumaca-logs/pacote.log
          for f in release/*.zip release/*.AppImage release/*.deb; do
            [ -f "$f" ] || continue
            mib=$(python -c "import os,sys;print(f'{os.path.getsize(sys.argv[1])/1048576:.1f}')" "$f")
            echo "$(basename "$f"): $mib MiB" | tee -a ../../fumaca-logs/tamanhos.txt
            echo "::notice title=pacote ${{ matrix.os }}::$(basename "$f"): $mib MiB"
          done

      - name: Pacote macOS (.zip) - T-R2 a T-R7
        if: runner.os == 'macOS' && !cancelled()
        timeout-minutes: 15
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus/out
          TEST_RESULT: ${{ github.workspace }}/fumaca-logs/test-result-zip.json
        run: |
          set -o pipefail
          ditto -x -k apps/electron/release/*.zip "$RUNNER_TEMP/zip"
          "$RUNNER_TEMP/zip/catstudy-electron.app/Contents/MacOS/catstudy-electron" --teste --tm-sintetico 100000 2>&1 | tee fumaca-logs/electron-zip.log

      - name: Pacote Ubuntu (.AppImage) - T-R2 a T-R7
        if: runner.os == 'Linux' && !cancelled()
        timeout-minutes: 15
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus/out
          TEST_RESULT: ${{ github.workspace }}/fumaca-logs/test-result-appimage.json
        run: |
          set -o pipefail
          img=$(realpath apps/electron/release/*.AppImage)
          chmod +x "$img"
          cd "$RUNNER_TEMP"
          xvfb-run -a --server-args="-screen 0 1920x1080x24" "$img" --appimage-extract-and-run --teste --tm-sintetico 100000 2>&1 | tee "$GITHUB_WORKSPACE/fumaca-logs/electron-appimage.log"

      - name: Pacote Ubuntu (.deb) - T-R2 a T-R7
        if: runner.os == 'Linux' && !cancelled()
        timeout-minutes: 15
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus/out
          TEST_RESULT: ${{ github.workspace }}/fumaca-logs/test-result-deb.json
        run: |
          set -o pipefail
          sudo apt-get update -q
          deb=$(realpath apps/electron/release/*.deb)
          sudo apt-get install -y -q "$deb" 2>&1 | tee fumaca-logs/deb-install.log
          cd "$RUNNER_TEMP"
          xvfb-run -a --server-args="-screen 0 1920x1080x24" /opt/catstudy-electron/catstudy-electron --teste --tm-sintetico 100000 2>&1 | tee "$GITHUB_WORKSPACE/fumaca-logs/electron-deb.log"

      - name: Resumo
        if: always()
        run: |
          for log in fumaca-logs/electron-*.log; do
            [ -f "$log" ] || continue
            nome=$(basename "$log" .log)
            grep -E "PASSOU|FALHOU|TODOS PASSARAM|HÁ FALHAS|FATAL" "$log" | paste -sd'|' - | while IFS= read -r l; do
              echo "::notice title=${nome#electron-} ${{ matrix.os }}::$l"
            done
          done

      - name: Publicar pacotes
        if: runner.os != 'Windows' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: pacotes-${{ matrix.os }}
          path: |
            apps/electron/release/*.zip
            apps/electron/release/*.AppImage
            apps/electron/release/*.deb
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar resultado e logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fumaca-${{ matrix.os }}
          path: |
            apps/electron/test-result.json
            fumaca-logs/
          if-no-files-found: warn
